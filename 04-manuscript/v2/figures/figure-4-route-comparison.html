<title>Route comparison</title>
<style>
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #6f6d68;
    --grid:           #e1e0d9;
    --axis:           #c3c2b7;
    --mature:         #2a78d6;  /* (b) compiled at pilot scale in Indonesia */
    --immature:       #eb6834;  /* (c) no compilation at any maturity */
    --flag:           #8a5a00;  /* verified / caveat markers */
    --flag-bg:        #fbf3e0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #a3a199;
      --grid:           #2c2c2a;
      --axis:           #383835;
      --mature:         #3987e5;
      --immature:       #d95926;
      --flag:           #e0b160;
      --flag-bg:        #241d0d;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #a3a199;
    --grid:           #2c2c2a;
    --axis:           #383835;
    --mature:         #3987e5;
    --immature:       #d95926;
    --flag:           #e0b160;
    --flag-bg:        #241d0d;
  }

  body {
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    margin: 0;
    padding: clamp(1rem, 3vw, 2.5rem);
  }
  .figure { max-width: 62rem; margin: 0 auto; padding: 0; }

  .plot-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .plot-scroll svg { display: block; width: 100%; min-width: 660px; height: auto; max-width: 100%; }

  .table-block { margin-top: 1.6rem; }
  .table-block h2 {
    margin: 0 0 0.5rem;
    font-size: 0.9rem;
    font-weight: 650;
    color: var(--text-primary);
  }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 40rem; font-size: 0.8rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--text-secondary); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.loc { font-size: 0.94em; color: var(--text-secondary); }
  tr.subtotal td { font-weight: 650; color: var(--text-primary); border-bottom: 2px solid var(--axis); }
  tr.aside td { color: var(--text-muted); }
  .flag {
    color: var(--flag);
    background: var(--flag-bg);
    font-weight: 650;
    font-size: 0.92em;
    padding: 0.05rem 0.28rem;
    border-radius: 0.2rem;
    white-space: nowrap;
  }
  .tablenote { margin-top: 0.6rem; font-size: 0.78rem; color: var(--text-muted); }

  figcaption {
    margin: 1.4rem 0 0;
    padding-top: 0.9rem;
    border-top: 1px solid var(--grid);
    font-size: 0.86rem;
    color: var(--text-secondary);
  }
  figcaption b { color: var(--text-primary); }
  figcaption p { margin: 0 0 0.7rem; }
  .source { margin-top: 0.6rem; font-size: 0.78rem; color: var(--text-muted); }
</style>

      <title id="figTitle">Share of the IBEI composite borne on, by ocean-account route and compilation maturity in Indonesia, after a primary re-check of the MMAF 2022 reports</title>
      <desc id="figDesc">
        A grouped horizontal bar chart on a continuous percentage axis. The upper group holds the
        routes for which an Indonesian account compilation exists at pilot scale, tag (b), verified
        against the Gili Matra pilot study: conservation area 4.06 per cent, the governance
        sub-pillar 5.15 per cent, ecosystem condition 2.32 per cent, rehabilitation 1.25 per cent,
        ecosystem services in physical units 0.00 per cent and benefit-transferred monetary
        valuation 0.00 per cent — 12.79 per cent of the composite combined. The lower group holds the
        one route with no Indonesian compilation at any maturity, tag (c): the
        classification-dependent social share, 13.70 per cent. Governance sits in the upper group
        because the pilot compiled a governance account, Tables 18 and 19 on printed page 79; the
        earlier version of this figure placed it in the lower group on a finding that has been
        withdrawn. The maturity gap is therefore 13.70 per cent against 12.79 per cent, roughly
        1.1 times, not the 2.5 times previously reported. What separates the routes is not maturity
        but content: no compiled account produces the constituent data item the register asks for on
        any of these rows, and the outputs the pilot does produce — monetary supply and use, zone
        areas, protection expenditure — carry no weight in the index.
      </desc>

    <p class="tablenote">
      Printed pages in the fourth column are Gili Matra pilot-study pages unless another document is
      named. Figures marked <i>own arithmetic</i> are products of published percentages; whether the
      Tabel 4–6 percentages are raw PC1 loadings or normalised contributions is not stated in the

  <figcaption>
    <p>
      <b>Fig. 4. What separates the account routes is content, not maturity.</b> Ocean-account routes plotted by
      the share of the IBEI composite whose production they would bear on, grouped by whether an account
      compilation exists in Indonesia. <b>12.79%</b> sits on routes compiled at pilot scale — governance
      5.15%, conservation area 4.06%, ecosystem condition 2.32%, rehabilitation 1.25%, and the two
      zero-weight service rows — against <b>13.70%</b> on the one route with no compilation at any
      maturity, the classification-dependent social share.
    </p>
    <p>
      <b>The maturity gap is now 1.1×, not the 2.5× previously reported.</b> The earlier version placed
      the governance sub-pillar in group (c) on finding 02, which reasoned from the non-retrievability of
      the three MMAF 2022 reports. Those reports are present, and the Gili Matra pilot compiles a
      governance account: zone areas with their legal and institutional authority, and environmental
      protection expenditure against the economic value of environmental service (Tables 18–19, p. 79).
      Governance is also one of the Roadmap's four priority accounts (§5.5, p. 15). Compilation maturity
      therefore no longer separates the routes.
    </p>
    <p>
      <b>What does separate them is content.</b> On every row in group (b), the compiled account fails to
      produce the constituent data item the register asks for: the pilot reports mean live coral cover by
      zone, not the share of area in a 50–100% cover class; rehabilitation-<i>zone</i> area, not restored
      area; zone areas and authorities, not a count of fishing ports with a fish auction place. Conversely,
      what the pilot does produce — a monetary supply–use table, benefit-transferred valuations, protection
      expenditure — carries <b>0.00%</b> weight, because no variable in Tabel 6 is a services or valuation
      measure. Method warrants are named, not asserted: TG-3.1, TG-3.2, TG-1.3, TG-4.8, TG-4.9 and
      TG-6.1–6.3 carry <b>badge Applied, status Draft</b>; TG-3.5 and TG-3.7 carry <b>badge Emerging</b>.
      Governance now shows those two axes diverging — an Emerging method with a pilot compilation behind it.
    </p>
    <p>
      <b>Read these shares as production coverage, not attainable score gain,</b> and note two carried
      caveats. The social indicators are and stay BPS outputs; the account contribution there is a
      classification standard and a compilation architecture, not a substitute data source, and 13.70% is
      the classification-dependent share, never 30.5%. The governance row follows the <b>three-pillar</b>
      structure of Tabel 4/5 and Gambar 11; under Tabel 1's four-pillar structure indicator 18 sits in a
      separate <i>Enabler</i> pillar, so this row — now the largest in group (b) — moves with the choice of
      table. Both structures are printed in the same handbook and are not reconciled here. Every other
      group (b) indicator (19–21, 24, 27) sits in Environment under both loci.
    </p>
