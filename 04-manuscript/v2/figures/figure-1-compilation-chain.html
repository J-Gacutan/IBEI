<title id="figTitle">The IBEI compilation chain and where ocean accounts could enter</title>
<desc id="figDesc">Panel a is an annual monitoring calendar running October of year n to January of year n plus two. It carries the Juknis Phase 1 coordination window in October to December, tagged maturity d, announced but not started, and the BPS SIRUSA 2025 schedule, in which activity planning and design run concurrently through February alone, then collection in April, processing in June, analysis in July, dissemination in August and evaluation from September to the following January. Panel b is a thirteen-step production chain, read down the left column then down the right column: published KKP and BPS publications and the 44 registered variables, machine-learning imputation for gaps, Z-score standardisation, a sub-pillar PCA, an indicator-reversal or drop step, a re-run sub-pillar PCA, re-standardisation, a pillar PCA, re-standardisation, a final IBEI PCA, a rescale by index divided by maximum index times 100, a provincial IBEI score, and the RPJPD 2025 to 2045 target circulated under SEB 2 of 2024. Account-derived data enters only at the source end, bearing on five register rows worth 7.64 per cent of the composite, with the account-side maturity claims verified against the primary reports. A closing strip states what the entry point is worth and what it does not reach: the five rows carry 7.64 per cent of the composite, of which about 4.06 per cent sits at a designation the account does not supply and about 1.25 per cent at an activity count it does not produce, leaving a supply share of about 2.33 per cent. Five numbered callouts are pinned to the steps they concern and annotated in the caption: no field operation, no imputation specifics, a pillar-count conflict, a rescale conflict and provincial targets above the national target.</desc>

  <figcaption>
    <b>Fig. 1. The IBEI compilation chain, and the single point at which ocean-account data can enter it.</b>
    (<b>a</b>) The annual monitoring calendar: the Juknis Phase 1 preparation-and-coordination window,
    October&#8211;December of year <i>n</i>, against the BPS SIRUSA 2025 activity schedule. The Juknis cycle is
    tagged <b>(d) announced but not started</b> &#8212; it is prescribed in the handbook (p. 71 [pdf 81]) and is drawn
    here as a prospective cycle, not as one observed running. In the SIRUSA schedule <i>Perencanaan Kegiatan</i>
    and <i>Desain</i> are both dated 2025-02-01 to 2025-03-01 and are therefore concurrent, occupying one month
    and not two. These are two separately published calendars; the sources do not state that they are the same
    cycle, and the drawn alignment is illustrative. Reference period of the collected variables is T&#8211;1,
    except nos. 12, 13 and 14, which are T&#8211;2. (<b>b</b>) The thirteen-step production chain, source to target. Steps 3&#8211;11 are quoted from the
    report&#8217;s own flow diagram (Gambar 3.1.1), including &#8220;reverse indicator values (or drop the indicator)
    if a negative relation is found&#8221;. Account-derived data can enter at one place only, step 1, where it bears
    on five registered rows &#8212; nos. 19&#8211;21 (percentage of coral reef, seagrass and mangrove in good
    condition), no. 24 (rehabilitation) and no. 27, whose register wording is a <i>designation</i>, not an observed
    extent: &#8220;total luas kawasan konservasi perairan <b>yang ditetapkan oleh</b> KKP, KLHK, dan Pemerintah
    Daerah per provinsi&#8221; (total area of aquatic conservation areas <i>designated by</i> KKP, KLHK and provincial
    governments). Together 7.64% of the composite, and about 2.3% for the three cover rows alone. Waste flows
    (nos. 25, 26) are &#8776;3.5% and are reported separately, never folded into that headline. Nothing downstream
    changes: standardisation, PCA weighting, the reversal rule and the final rescale are unaffected by the
    provenance of the input. <b>What the entry point does not reach.</b> The 7.64% is the share these account types bear on, not the share an account would supply: about 4.06% of it sits at no.&nbsp;27, a designation already held by its custodians, and about 1.25% at no.&nbsp;24, an activity count the account form does not produce. The supply share is about 2.33%. <b>Account-side status.</b> Every account-side element in this figure &#8212; the entry point at step&nbsp;1, the (b) maturity of Indonesian account outputs, and the ecosystem coverage &#8212; has been verified against the MMAF 2022 primary reports in <code>00-background/</code>. An earlier version of this figure carried these as unverified, and also printed a maturity inversion of roughly 2.5&#215; that the re-check refutes: the routes with a pilot-scale Indonesian compilation total 12.79% of the composite against 13.70% for the one route with no compilation at any maturity, a gap of 1.07&#215; &#8212; so what separates the routes is content, not maturity (Figure&nbsp;4). <b>Callouts.</b> <b>1</b>, SIRUSA records no pilot survey, no field staff, 0 supervisors and 0 enumerators, no
    staff training, no non-response adjustment and no microdata release; collection mode is compilation of
    administrative products, so every value in the chain is inherited from an upstream producer.
    <b>2</b>, the imputation annex publishes a framework &#8212; two availability scenarios, feature pre-processing,
    model spectrum with k-fold cross-validation, ensemble prediction, domain constraints &#8212; but names no
    indicator, no province, no chosen model, no achieved RMSE, MAE or R&#178;, no value of <i>k</i>, and no code,
    seed or repository. <b>3</b>, the rescale to a &#8220;1 to 100&#8221; range contradicts the same printed page,
    which states the score &#8220;is a relative measure with no definite upper or lower bound and can be positive or
    negative&#8221;; the document does not state which scale the published figures are on.
    <b>C1</b>, Tabel 1 prints four pillars, with an Enabler pillar holding indicators 15&#8211;18, while Tabel 4/5
    and Gambar 11 print three, placing tourism, technology and governance as Economy sub-pillars; both are in the
    same handbook and neither is chosen here. <b>C2</b>, 2045 provincial targets of 243.87 (Jawa Timur), 233.21
    (Nusa Tenggara Timur) and 222.31 (Jawa Tengah) sit against a national 2045 target of 100.00, on one table and
    one scale. <b>Maturity.</b> The KKP and BPS publications are (a) published official statistics; a register row
    states a required input and is <i>not</i> evidence that the input is published; every Indonesian ocean account
    output is (b) experimental or pilot; no Indonesian social account exists above (c), methodology under
    development, whilst the Gili Matra pilot does compile a governance account at (b). <b>Derived values.</b> 36.9% &#215; 50.0% = 18.45%, the Tier&nbsp;A 7.64%, the
    ecosystem-condition &#8776;2.33%, the social 13.7% and the governance 5.15% are the
    article&#8217;s own arithmetic over the published weights; whether
    the percentages in Tabel 4&#8211;6 are raw PC1 loadings or normalised contributions is not stated in the source.
    Box size, spacing and the drawn alignment of the two calendars are illustrative and carry no quantitative
    meaning.
  </figcaption>

  <p class="src" id="srcnote">
    <b>Sources.</b> Pillar weights, sub-pillar and variable shares, provincial and national targets, the

    p. 68 [pdf 78]; Gambar 2, p. 71 [pdf 81]; Gambar 11, p. 93 [pdf 103]; Tabel 4 and Tabel 5,

    stages, the final rescale and the bounded-versus-unbounded conflict: <i>IBEI Report 2024</i>
    (December 2025 revision), Gambar 3.1.1, p. 30 [pdf 42]; pp. 29&#8211;33 [pdf 41&#8211;45], with the
    conflict on p. 33 [pdf 45]. Imputation framework and the specifics it omits: Report Lampiran 1,
    pp. 64&#8211;66 [pdf 76&#8211;78]. Field operation, collection mode, reference periods and the
    44-variable register: BPS SIRUSA, statistical activity 94936 and indicator pages 105709&#8211;105718
    (web pages, no pagination); the concurrent February planning-and-design dates from the
    <i>Rencana Jadwal Kegiatan</i> (<code>doc_4_sirusa-metadata_chunk_006</code>). The (d) tag on the annual
    monitoring cycle: Juknis &#167;4.1.1 and Gambar 2, p. 71 [pdf 81] (<code>doc_1_juknis-cascading_chunk_112</code>).
    <b>Account-side claims are not from the tier-1 corpus.</b> The corpus covers the Juknis, the IBEI Report 2024,
    Rinaldi et al. 2025 and SIRUSA only, and holds no account-side material. Account maturity (b) and the
    mangrove&#8211;seagrass&#8211;coral coverage were carried from a secondary finding and have since been read
    against the MMAF 2022 primary reports directly, which is the source relied on here. The national
    <b>2018 opening / 2021 closing extent series is CONTESTED</b> &#8212; not evidenced in the primary documents,
    which record site-level figures instead &#8212; and is for that reason not drawn or relied on here
    (Figure&nbsp;5). Where account outputs are described, <i>ecosystem services in
    physical units</i> and <i>benefit-transferred monetary valuation</i> are distinct and are never covered by the
    bare word &#8220;services&#8221;; only the latter is evidenced, at pilot scale. PODES is not named anywhere in
    the tier-1 corpus and is therefore not shown as a source.
  </p>
