<title>Where the Weight Sits</title>
<style>
:root {
  color-scheme: light;
  --page:        #f9f9f7;
  --surface:     #fcfcfb;
  --ink:         #0b0b0b;
  --ink-2:       #52514e;
  --muted:       #6f6d67;
  --hair:        #e1e0d9;
  --rule:        #c3c2b7;
  --c-acct:      #2a78d6;
  --c-acct-soft: #cde2fb;
  --c-soc:       #eb6834;
  --c-soc-soft:  #fbdccf;
  --c-out:       #86847c;
  --pill-fill:   #efeee9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --ink:         #ffffff;
    --ink-2:       #c3c2b7;
    --muted:       #a3a199;
    --hair:        #2c2c2a;
    --rule:        #383835;
    --c-acct:      #3987e5;
    --c-acct-soft: #123252;
    --c-soc:       #d95926;
    --c-soc-soft:  #4a2313;
    --c-out:       #5a5952;
    --pill-fill:   #242422;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:        #0d0d0d;
  --surface:     #1a1a19;
  --ink:         #ffffff;
  --ink-2:       #c3c2b7;
  --muted:       #a3a199;
  --hair:        #2c2c2a;
  --rule:        #383835;
  --c-acct:      #3987e5;
  --c-acct-soft: #123252;
  --c-soc:       #d95926;
  --c-soc-soft:  #4a2313;
  --c-out:       #5a5952;
  --pill-fill:   #242422;
}
* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; }
body {
  margin: 0; padding: 1.5rem 1rem 3rem;
  background: var(--page); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px; line-height: 1.5;
}
.wrap { max-width: 76rem; margin: 0 auto; }
figure { margin: 0; padding: 0; }
.scroll { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
  border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); padding: .25rem 0; }
svg { display: block; max-width: 100%; height: auto; }
/* min-width keeps the scroll container engaged so 9.5px chart type never shrinks below ~8px */
.scroll > svg { width: 100%; min-width: 64rem; max-width: 100%; height: auto; }
.legend { display: grid; gap: .55rem; margin: .85rem 0 .2rem;
  font-size: .8rem; color: var(--ink-2); }
.legend span.k { display: grid; grid-template-columns: 15px 1fr; align-items: start;
  gap: .5rem; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em;
  background: var(--pill-fill); border-radius: 2px; padding: 0 .2em; }
.sw { width: 15px; height: 15px; border-radius: 2px; flex: none; margin-top: .15rem; }
.note { font-size: .78rem; color: var(--muted); margin: .35rem 0 0; }
.calls { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
  margin: 1.1rem 0 .4rem; }
.call { border-left: 3px solid var(--c-acct); padding: .1rem 0 .1rem .6rem; font-size: .82rem;
  color: var(--ink-2); }
.call.b { border-left-color: var(--c-soc); }
.call.c { border-left-color: var(--c-out); }
.call b { color: var(--ink); font-weight: 650; }
.call .m { font-weight: 700; color: var(--ink); }
figcaption { font-size: .82rem; color: var(--ink-2); margin-top: 1.1rem;
  border-top: 1px solid var(--hair); padding-top: .8rem; }
figcaption b { color: var(--ink); }
.src { font-size: .76rem; color: var(--muted); margin-top: .55rem; }
details { margin-top: .9rem; font-size: .82rem; }
summary { cursor: pointer; color: var(--ink-2); font-weight: 600; }
.tw { overflow-x: auto; margin-top: .6rem; }
table { border-collapse: collapse; font-size: .76rem; min-width: 46rem; }
th, td { text-align: left; padding: .3rem .55rem; border-bottom: 1px solid var(--hair);
  vertical-align: top; }
th { color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
  font-size: .68rem; }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
.dim { color: var(--muted); }
/* svg text roles */
.hd  { fill: var(--ink); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; }
.pnl { fill: var(--ink); font-size: 13px; font-weight: 700; }
.hd2 { fill: var(--muted); font-size: 9.5px; }
.pn  { fill: var(--ink); font-size: 13px; font-weight: 650; }
.pv  { fill: var(--ink); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pt  { fill: var(--ink-2); font-size: 10px; }
.sn  { fill: var(--ink); font-size: 11.5px; font-weight: 620; }
.sv  { fill: var(--ink-2); font-size: 10px; font-variant-numeric: tabular-nums; }
.chip{ fill: var(--ink); font-size: 11.5px; font-weight: 800; }
.inb { fill: var(--ink); font-size: 9.5px; font-weight: 700; text-anchor: middle;
        font-variant-numeric: tabular-nums; paint-order: stroke; stroke: var(--surface);
        stroke-width: 2.5px; }
.sec { fill: var(--ink); font-size: 11.5px; font-weight: 700; }
.vn  { fill: var(--ink-2); font-size: 10.5px; }
.vv  { fill: var(--ink); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.ax  { fill: var(--muted); font-size: 9.5px; text-anchor: middle; font-variant-numeric: tabular-nums; }
.mk  { fill: var(--c-acct); font-size: 11px; font-weight: 700; paint-order: stroke;
        stroke: var(--surface); stroke-width: 2.5px; }
.pill { fill: var(--pill-fill); stroke: var(--rule); stroke-width: 1; }
.lead { fill: none; stroke: var(--rule); stroke-width: 1; }
.grid { stroke: var(--hair); stroke-width: 1; }
.rule { stroke: var(--rule); stroke-width: 1; }
@media (max-width: 40rem) { body { padding: 1rem .6rem 2rem; } figure { padding: .9rem; } }
</style>

    <title id="a-t">Cascade of the published IBEI weight structure, pillar to sub-pillar</title>
    <desc id="a-d">A two-level icicle chart. The left column divides the composite into three pillars:
    environment 36.9 per cent, economy 32.6 per cent, social 30.5 per cent. The right column divides
    each pillar into its sub-pillars, area proportional to share of the whole composite: health 20.77,
    marine resource quality and conservation 18.45, renewable energy 18.45, marine-based industry 7.69,
    marine tourism 7.20, trade transport and logistics 6.29, welfare 5.55, governance 5.15, capture
    fisheries and aquaculture 4.96, education 4.18, technology 1.34. Within marine resource quality,
    a hatched band marks the 7.64 per cent of the composite that ecosystem extent and condition
    accounts could supply: the Tier A five, indicators 19, 20 and 21 condition at about 2.33,
    indicator 24 rehabilitation at 1.25 and indicator 27 conservation area at 4.06. Ecosystem
    services in physical units are not part of that route and are not compiled in Indonesia; what
    exists is benefit-transferred monetary valuation at pilot scale. The two waste-flow variables,
    indicators 25 and 26, are drawn unshaded and reported separately at about 3.5 per cent; they
    are never folded into the headline. Governance is dotted in the account colour rather than the
    social colour, because it is the one extension route with a pilot-scale Indonesian compilation
    behind it; the three social bands have none at any maturity. Account-side claims in this figure
    have been verified against the MMAF 2022 primary reports.</desc>

  <p class="note"><b>Account-side status.</b> The shading classes, the maturity tags and the
  coverage statement in this figure have been verified against the three MMAF 2022 reports in
  <code>00-background/</code>. An earlier version asserted them from a finding that reasoned from the
  non-retrievability of those reports, and printed a maturity inversion of <b>2.5&times;</b> which
  that re-check refutes; the corrected comparison is <b>12.79%</b> compiled at pilot scale against
  <b>13.70%</b> not compiled at any maturity, <b>1.07&times;</b> (Figure&nbsp;4). The IBEI-side
  weights, shares and locators never depended on it. The 13.70% social figure is the
  article's own arithmetic over the verbatim <i>Data Pembentuk Indikator</i>, in the four components
  deposited at Supplementary Data S2: PKH transfer ratio 4.59% + fisher and fisherwomen counts 0.97%
  + education domain cuts 1.91% + health insurance 6.23%. The rest of the 30.5% pillar is not
  sector-conditioned &mdash; per-capita fish consumption &asymp;14.21%, KKP education counts
  &asymp;2.28%, coastal poverty &asymp;0.33% &mdash; and the four components sum to 30.5%.</p>

  <figcaption>
    <b>Fig. 3. Where the weight sits in the IBEI: 44 variables, 11 sub-pillars, 3 pillars.</b> The
    published IBEI 2025 weight structure, drawn with area proportional to share of the composite.
    (<b>a</b>) Pillar and sub-pillar levels in full: pillar weights from Tabel 4, p. 94 [pdf 104];
    sub-pillar shares from Tabel 5 and Gambar 11, pp. 93&ndash;94 [pdf 103&ndash;104]; the third column
    gives the derived share of the composite, the share of the parent pillar, and the handbook's own
    tertile. (<b>b</b>) The three sub-pillars the argument turns on, opened to variable level on one
    shared scale (Tabel 6, pp. 95&ndash;96 [pdf 105&ndash;106]).
    <b>Four readings.</b> First, the two ecosystem-condition variables an ocean account is built to
    produce are the two smallest things in their sub-pillar: good-condition coral reef area at 0.68% of
    the composite and good-condition mangrove forest area at 0.06%, with seagrass the largest of the
    three at 1.59% &mdash; 2.33% for all three together. Second, two counts of coastal-village
    facilities outweigh all ecosystem condition by more than three to one: villages with a sanitation
    place (3.84%) plus villages with a waste-disposal place (3.45%) come to 7.29%, a ratio of 3.1 to 1,
    and both are village counts, not marine measurements. Third, the governance sub-pillar is one
    variable at 100.0% of itself &mdash; <i>jumlah pelabuhan perikanan dengan Tempat Pelelangan Ikan</i>,
    the number of fishing ports with a fish auction place, carrying 5.15% of the composite and standing
    as the whole of what the index measures as governance; under Tabel 1's four-pillar structure this
    indicator sits in an Enabler pillar instead, and the handbook prints both. Fourth, half the
    environment pillar is renewable energy that is not marine: sub-pillar H is 50.0% of the pillar
    (18.45% of the composite) and consists of installed capacity and generation for solar (PLTS) and
    hydropower (PLTA), with no offshore wind, tidal or wave; Tabel 5 labels this 50.0% <b>Low</b> and
    the other 50.0% <b>High</b>, and the tie is in the source.
    <b>Shading is the article's own classification</b> of account-addressability against Indonesia's
    actual account coverage &mdash; mangrove, seagrass and coral reef only, <b>extent and
    condition</b>. <b>&#9670;</b> <i>Ecosystem services</i> is deliberately not used as a single
    class here: <b>ecosystem services in physical units</b> are not compiled in Indonesia, and what
    the primary record contains is <b>benefit-transferred monetary valuation</b> of ecosystem
    functions at pilot scale (coral values transferred from Bohol and the Marianas). The two are
    never conflated, and neither is folded into the 7.64%. The hatched 7.64% is the Tier A five
    (indicators 19, 20, 21 condition 2.33%; 24 rehabilitation 1.25%; 27 conservation area 4.06%);
    the two waste-flow variables (25, 26) are drawn unshaded and reported separately at
    &asymp;3.5%. Compilation method for the hatched class is covered by GOAP Technical Guidance
    TG-6.1 <i>Coral Reef Ecosystem Accounting</i> (badge <b>Applied</b>, status Draft, v7.0), TG-6.2
    <i>Coastal Wetland and Seagrass Accounting</i> (badge <b>Applied</b>, status Draft, v7.0) and
    TG-6.3 <i>Seagrass Ecosystem Accounting</i> (badge <b>Applied</b>, status Draft, v8.0); for the
    dotted class by TG-3.5 <i>Social Accounts</i> and TG-3.7 <i>Governance Accounts</i>, both badge
    <b>Emerging</b>, status Draft. A method badge warrants the method, never an Indonesian output.
    The classification is not part of the IBEI and appears nowhere in the source; pattern and written
    label carry the class, colour alone does not. The structure shown is the <b>three-pillar</b> one of
    Tabel 4/5 and Gambar 11; Tabel 1 of the same handbook prints <b>four</b>, with an Enabler pillar
    holding indicators 15&ndash;18, which moves the governance sub-pillar (F) shown here. That conflict
    is unresolved in the source and is not resolved here.
    <b>Derived values are the article's own arithmetic over
    published percentages</b> (pillar &times; sub-pillar &times; variable): the source does not state
    whether the Tabel 4&ndash;6 percentages are raw PC1 loadings or normalised contributions, so the
    products are read as relative shares, not as a reconstructed formula. Where they can be checked
    against a published figure they agree &mdash; the derived sub-pillar shares reproduce Gambar 11 to
    the nearest whole point. Tertile labels (High / Medium / Low) are <b>BAPPENAS's own simplification</b>,
    assigned by ranking each component within its group; they are reported here beside the percentage
    and include the 50.0 / 50.0 tie in Tabel 5 labelled High and Low. Tabel 5's economy column sums to
    100.1 as printed; sub-pillar heights are drawn against their printed column total.
    <b>Maturity.</b> The IBEI weights are <b>published methodology</b>, and the maturity scale does
    not apply to them: a tag describes a datum, not a document, and no <b>(a)</b> tag attaches here.
    The IBEI itself is registered in SIRUSA as <i>Statistik Sektoral</i> &mdash; sectoral, not BPS
    official basic statistics &mdash; with the <i>Identitas Rekomendasi</i> field empty and the
    <i>Metode Analisis</i> recorded as <b>DESKRIPTIF</b>, and microdata explicitly not released
    (SIRUSA <i>kegiatan</i> 94936, <i>Informasi Umum</i> and <i>Pengolahan dan Analisis</i>; web
    page, no pagination; chunks <code>doc_4_sirusa-metadata_chunk_001</code> and
    <code>_009</code>). Every juknis-weights chunk in the tier-1 corpus is tagged
    <code>not_applicable</code> accordingly. <b>Account-side maturity.</b> Every Indonesian
    ocean-account output is <b>(b)</b> experimental or pilot compilation, covering mangrove, seagrass
    and coral reef only. Governance is <b>(b)</b> as well, on the Gili Matra pilot's own governance
    account; no social account exists in Indonesia above <b>(c)</b> methodology under development.
    That statement was formerly carried as unverified, resting on a finding that
    reasoned from the non-retrievability of the three MMAF 2022 reports; those reports are present in
    <code>00-background/</code>, the re-check against them is complete, and the tags above are its
    result. Two formulations remain withheld as unevidenced and are <i>not</i> asserted here:
    <b>&ldquo;34 provinces dashboard-selectable&rdquo;</b> is a platform observation rather than a
    documented compilation count, so the numeral is withheld and only <b>one province (NTB)</b> is
    stated to carry a documented published compilation; and the <b>national 2018 opening / 2021
    closing extent series</b> is not evidenced in the primary documents and is not used as a coverage
    warrant.
    <p class="src"><b>Source.</b> BAPPENAS, <i>Petunjuk Teknis Pedoman Indikator Ekonomi Biru dalam
    RPJPN 2025&ndash;2045</i> (2025): Gambar 11, p. 93 [pdf 103]; Tabel 4, p. 94 [pdf 104]; Tabel 5,
    p. 94 [pdf 104]; Tabel 6, pp. 95&ndash;96 [pdf 105&ndash;106]; Tabel 7, pp. 101&ndash;104
    [pdf 111&ndash;114]; simplification rule for the tertiles, p. 94 [pdf 104]; four-pillar structure,
    Tabel 1, pp. 11&ndash;13 [pdf 21&ndash;23]. Weights are stated to be produced automatically by the
    PCA process (p. 93 [pdf 103]). Registration status: BPS SIRUSA, <i>Detail Metadata Kegiatan
    Statistik: Kompilasi Penyusunan Indonesia Blue Economy Index (IBEI) 2025</i>,
    <i>kegiatan</i> 94936 (web page, no pagination). Method badges verified in the circular
    frontmatter: <code>src/circulars/section-6/6-1-coral-reef.md</code>,
    <code>6-2-mangrove-wetland.md</code>, <code>6-3-seagrass.md</code>,
    <code>section-3/3-5-social-accounts.md</code>, <code>3-7-governance.md</code>. Account-side
    maturity: verified against the three MMAF 2022 reports in <code>00-background/</code>.
    Account-addressability shading and all products of published percentages are the
    article's own.</p>
  </figcaption>
