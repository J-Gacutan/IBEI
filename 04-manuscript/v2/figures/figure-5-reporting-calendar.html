    <title id="fig6-title">The IBEI reporting window compared with the vintages Indonesian ocean accounts have actually produced, 2015 to 2027</title>
    <desc id="fig6-desc">A two-register timeline on one time axis running 2015 to 2027. The upper register shows what the index requires: an October to December Phase 1 coordination window in each year n, drawn as a full calendar quarter; a reference period of T minus 1 for every registered variable, where the register row specifies a required input and is therefore not itself evidence that the input is published; province-level annual estimation across the whole territory; and the statutory hook of Presidential Regulation 12 of 2025 with Joint Circular Letter 2 of 2024 carrying provincial targets to 2045. The lower register shows what the accounts have produced. Its first row is drawn struck out and labelled contested: the national extent series opening 2018 and closing 2021 was not found in the primary Ministry of Marine Affairs and Fisheries and Statistics Indonesia documents when those were read at source, and is shown as a claim withdrawn from the evidence base rather than as a produced vintage. What is verified in its place is the Gili Matra pilot in West Nusa Tenggara, opening 2015 and closing 2021, drafted 2022, presented internationally in June 2023, followed by a public national dashboard in July 2025, roughly four years after the pilot closing year. A separate conflict block prints two irreconcilable extent figures for that same pilot: the ministry report gives coral 259.50 falling to 247.50 hectares, seagrass 76.75 rising to 102.50, mangrove 21.50 falling to 10.69, while the statistics office presentation gives coral 183.34 falling to 165.08, seagrass 56.50 rising to 64.93, mangrove 13.53 falling to 6.15, sourced to the geospatial agency in 2020 and validated in 2021. No reconciliation is published and neither is adopted. The dashboard is annotated to say that making a province selectable on a platform is not the same as compiling an account for it, that one province carries a documented published compilation, and that the frequently repeated count of thirty-four provinces is itself contested and is not used. No closing year later than 2021 exists in the public domain, and there is no revision policy and no Statistics Indonesia statistical work-programme entry. Between the two registers a bracket marks the gap between the most recent account closing year, 2021, and the reference year the 2025 index cycle requires, 2024: three reference years. Every remaining element in the lower register has been verified against the primary reports.</desc>

  <figcaption>
    <p><strong>Fig. 5. The reporting window and the account vintages: an annual index obligation against a single
    2021 closing stock.</strong> One time axis, two registers. Above,
    the cycle the index is obliged to run: Phase 1 preparation and coordination in October–December of each year <em>n</em>,
    drawn as a full calendar quarter (Juknis p. 71 [pdf 81], tag (d)); a reference period of T−1 specified for the registered
    variables, with the register's own
    exception that variables 12, 13 and 14 carry T−2 — a two-year lag inside a single index vintage, preserved here as a
    defect of the source, not corrected; annual, cross-sectional compilation covering the whole territory at an estimation
    level of province (SIRUSA <code>kegiatan/94936</code>, tag (a)); and the statutory hook, Perpres No. 12/2025 on the RPJMN
    2025–2029 reinforced by SEB Mendagri–Bappenas No. 2/2024 on RPJPD indicators and targets to 2045 (Juknis p. 68 [pdf 78],
    tag (a)). Below, what Indonesian ocean accounts have actually put in the public domain: the Gili Matra pilot in West Nusa
    Tenggara opening 2015 and closing 2021, drafted 2022 and presented June 2023; a national dashboard public in July 2025,
    roughly four years after that closing year; one closing year in total; and no revision policy, compilation schedule or BPS
    statistical work-programme entry.</p>

    <p><strong>What the lower register no longer claims.</strong> The <span class="contest">national extent series opening
    2018 and closing 2021</span> is drawn struck out and labelled <span class="contest">⚠ CONTESTED</span>. When the primary
    MMAF and BPS documents now in <code>00-background/</code> were read at source, that series was not found: the 2022 MMAF
    and 2023 BPS material is Gili Matra only. It is left on the timeline, struck through, so that the withdrawal is visible
    where the claim used to sit rather than confined to a note. In its place the figure prints the conflict the primary
    documents do contain — two official figure sets for the same pilot, the same years and the same three ecosystems, with no
    published reconciliation. Neither set is adopted, averaged or preferred here.</p>

    <p><strong>The dashboard.</strong> Making a province selectable on a platform is not the same as compiling an account for
    it. One province — NTB — carries a documented published compilation (Gili Matra). <span class="contest">The localities “North Lombok” and “Saleh Bay, Sumbawa” are stated in no primary document in <code>00-background/</code> and are withheld pending re-check</span>. The
    widely repeated count of <span class="contest">“34 provinces dashboard-selectable”</span> is a platform observation
    reached through finding 02, is stated in no primary document in <code>00-background/</code>, and is <span
    class="contest">contested</span>; the numeral is therefore not used, in the figure or in this caption.</p>

    <p>The argument is the vertical distance between the registers, and the figure makes it measurable at one point: the
    2025 index cycle requires a 2024 reference year, while the most recent account closing year available is 2021 — a gap of
    <strong>three reference years</strong>, drawn as the bracket across the axis. The accounts cannot presently hit the
    window. That is a statement about compilation cadence, not about the value of either instrument: BAPPENAS plans and MMAF
    and BPS produce statistics, and closing the cadence gap is a production-capacity question inside the second mandate.</p>

    <p><strong>Reading rule.</strong> Maturity tags describe the datum, not the document. The row labelled <em>reference
    period T−1</em> therefore carries <strong>no tag</strong>: a register row specifying a required input is evidence about
    what the index demands, not evidence that the input is published. Tag <span class="tag">(a)</span> is reserved in the
    upper register for data actually produced and released — the SIRUSA activity design and release date, and the two legal
    instruments — while the monitoring cycle itself, which the handbook sets out prospectively, is tagged <span
    class="tag">(d)</span>, announced but not started. The lower register is tagged <span class="tag">(b)</span> throughout —
    experimental or pilot compilation — and every element still standing in it is additionally <strong>◆ pending primary
    re-check</strong>: its vintages, lags and absences trace to finding 02, a research aid that reasoned in part from
    documents it could not open. Those documents have now been opened for the extent series, which is why that one row is
    struck out rather than merely flagged; the remaining rows have not been re-checked and stay provisional. No published
    weight, share or hectare figure from the IBEI's own documentation is used anywhere in this figure. Three values carry the
    argument: the gap of <strong>three reference years</strong>; account turnaround of <strong>≈ 4 years</strong> (2021 pilot
    closing stock → public dashboard July 2025) against index turnaround of <strong>≈ 7 months</strong> (2024 reference year
    closes → planned release 6 August 2025); and <strong>one account closing year</strong> in the public domain against
    an index that must post a new provincial value every year. The two turnaround figures and the three-year gap
    are the article's own arithmetic over the dated series shown.</p>

    <p>Three conflicts inside the published sources are preserved rather than resolved. The two extent figure sets for the
    Gili Matra pilot, printed in full in the figure. SIRUSA renders the reference period for
    the same variables as <code>T-1</code> in one table and <code>2024</code> in another. And the 2045 targets the SEB
    circulates are provincial values above 100 (Jawa Timur 243.87, Nusa Tenggara Timur 233.21, Jawa Tengah 222.31) against a
    national target of 100.00 (Juknis p. 69 [pdf 79]). None is adopted here. The figure's timeline is drawn to scale on
    calendar years; the row heights are presentational only.</p>
