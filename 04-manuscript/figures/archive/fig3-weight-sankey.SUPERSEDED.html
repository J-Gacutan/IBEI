    <desc id="s-d">A Sankey diagram. The IBEI composite divides into three pillars: environment
    36.9 per cent, economy 32.6 per cent, social 30.5 per cent. Those divide into eleven sub-pillars,
    ribbon thickness proportional to share of the whole composite: health 20.77, marine resource
    quality and conservation 18.45, renewable energy 18.45, marine-based industry 7.69, marine
    tourism 7.20, trade transport and logistics 6.29, welfare 5.55, governance 5.15, capture
    fisheries and aquaculture 4.96, education 4.18, technology 1.34. The marine resource quality
    sub-pillar alone is opened to its nine variables: marine conservation area 4.06, coastal
    villages with a sanitation place 3.84, coastal villages with a waste-disposal place 3.45, waste
    leaking to sea 2.75, seagrass in good condition 1.59, mangrove rehabilitation 1.25, waste
    disposed on land 0.77, coral reef in good condition 0.68, mangrove forest in good condition
    0.06. Hatched ribbons mark the 7.64 per cent of the composite that ecosystem extent, condition
    and service accounts could supply.</desc>

  <figcaption>
    <b>Fig. 3. Where the weight sits in the IBEI.</b> The published IBEI 2025 weight structure as a
    Sankey, ribbon thickness proportional to share of the composite: pillar weights from Tabel 4,
    p. 94 [pdf 104]; sub-pillar shares from Tabel 5 and Gambar 11, pp. 93&ndash;94 [pdf 103&ndash;104].
    Ten sub-pillars terminate at sub-pillar level; the eleventh, <b>G</b>, is opened to its nine
    variables (Tabel 6, pp. 95&ndash;96 [pdf 105&ndash;106]) because that is where the ocean-account
    question is decided. Each label gives the derived share of the composite, the share of the parent,
    and the handbook's own tertile. Every other variable is in the table below.
    <b>Four readings.</b> First, the two ecosystem-condition variables an ocean account is built to
    produce are the two thinnest ribbons in the figure: good-condition coral reef area at 0.68% of the
    composite and good-condition mangrove forest area at 0.06%, whose true thickness at this scale is
    0.7&nbsp;px and which is drawn at a 1.8&nbsp;px hairline floor so that it can be seen at all
    &mdash; with seagrass the largest of the three at 1.59%, and 2.32% for all three together. Second, two counts of coastal-village facilities outweigh all ecosystem condition by
    more than three to one: villages with a sanitation place (3.84%) plus villages with a
    waste-disposal place (3.45%) come to 7.29%, a ratio of 3.1 to 1, and both are village counts, not
    marine measurements. Third, the governance sub-pillar (<b>F</b>, 5.15%) is a single variable at
    100.0% of itself &mdash; <i>jumlah pelabuhan perikanan dengan Tempat Pelelangan Ikan</i>, the
    number of fishing ports with a fish auction place, standing as the whole of what the index
    measures as governance; under Tabel 1's four-pillar structure this indicator sits in an Enabler
    pillar instead, and the handbook prints both. Fourth, half the environment pillar is renewable
    energy that is not marine: sub-pillar <b>H</b> is 50.0% of the pillar (18.45% of the composite)
    and consists of installed capacity and generation for solar (PLTS) and hydropower (PLTA), with no
    offshore wind, tidal or wave; Tabel 5 labels this 50.0% <b>Low</b> and the other 50.0% <b>High</b>,
    and the tie is in the source.
    <b>Shading is the article's own classification</b> of account-addressability against Indonesia's
    actual account coverage &mdash; mangrove, seagrass and coral reef only, extent / condition /
    services. It is not part of the IBEI and appears nowhere in the source; pattern and written label
    carry the class, colour alone does not. Upstream ribbons are drawn neutral because a pillar mixes
    classes; classification is applied where the flow terminates. The structure shown is the
    <b>three-pillar</b> one of Tabel 4/5 and Gambar 11; Tabel 1 of the same handbook prints
    <b>four</b>, with an Enabler pillar holding indicators 15&ndash;18, which moves the governance
    sub-pillar (F) shown here. That conflict is unresolved in the source and is not resolved here.
    <b>Derived values are the article's own arithmetic over published percentages</b>
    (pillar &times; sub-pillar &times; variable): the source does not state whether the Tabel 4&ndash;6
    percentages are raw PC1 loadings or normalised contributions, so the products are read as relative
    shares, not as a reconstructed formula. Where they can be checked against a published figure they
    agree &mdash; the derived sub-pillar shares reproduce Gambar 11 to the nearest whole point. Tertile
    labels (High / Medium / Low) are <b>BAPPENAS's own simplification</b>, assigned by ranking each
    component within its group; they are reported here beside the percentage and include the
    50.0 / 50.0 tie in Tabel 5 labelled High and Low. Tabel 5's economy column sums to 100.1 as
    printed; sub-pillar thicknesses are drawn against their printed column total.
    Maturity: the IBEI weights themselves are <b>(a)</b> published official methodology; every
    Indonesian ocean account output is <b>(b)</b> experimental or pilot compilation, covering mangrove,
    seagrass and coral reef only, with 34 provinces dashboard-selectable and one province with a
    documented published compilation; social and governance accounts do not exist in Indonesia above
    <b>(c)</b> methodology under development.
    <p class="src"><b>Source.</b> BAPPENAS, <i>Petunjuk Teknis Pedoman Indikator Ekonomi Biru dalam
    RPJPN 2025&ndash;2045</i> (2025): Gambar 11, p. 93 [pdf 103]; Tabel 4, p. 94 [pdf 104]; Tabel 5,
    p. 94 [pdf 104]; Tabel 6, pp. 95&ndash;96 [pdf 105&ndash;106]; Tabel 7, pp. 101&ndash;104
    [pdf 111&ndash;114]; simplification rule for the tertiles, p. 94 [pdf 104]; four-pillar structure,
    Tabel 1, pp. 11&ndash;13 [pdf 21&ndash;23]. Weights are stated to be produced automatically by the
    PCA process (p. 93 [pdf 103]). Account-addressability shading and all products of published
    percentages are the article's own.</p>
  </figcaption>
