  <figcaption>
    <b>Figure 2. The leverage inversion.</b> Ocean-account routes plotted by the share of
    the Indonesia Blue Economy Index composite whose production they would bear on, grouped by
    compilation maturity in Indonesia. The <b>mature route</b> — the Tier A five, indicators 19, 20, 21,
    24 and 27 — bears on <b>7.64%</b> of the composite: conservation area 4.06%, ecosystem condition
    2.32%, rehabilitation 1.25%, ecosystem services in physical units 0.00% and benefit-transferred
    monetary valuation 0.00%, since no variable in Tabel 6 is a services measure of either kind. Its
    method warrant is not asserted but named: <b>TG-3.1</b> <i>Asset Accounts</i>, <b>TG-3.2</b>
    <i>Flows from Environment to Economy</i>, <b>TG-1.3</b> <i>OA and Marine Spatial Management
    (including MPAs)</i>, <b>TG-4.8</b> <i>Physical Condition Measurement</i>, <b>TG-4.9</b>
    <i>Biological Condition Measurement</i>, <b>TG-6.1</b> <i>Coral Reef</i>, <b>TG-6.2</b>
